<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>百分比寬度示範</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      margin: 32px;
      color: #17324d;
    }

    .parent {
      width: 80%;
      padding: 20px;
      background: #dceef5;
      border: 3px solid #286c86;
    }

    .child {
      width: 50%;
      padding: 18px;
      background: #f7c9ba;
      border: 3px solid #e76f51;
    }

    .grandchild {
      width: 50%;
      padding: 14px;
      background: #d9efe9;
      border: 3px solid #2a9d8f;
    }
  </style>
</head>
<body>
  <h1>百分比寬度看父元素</h1>
  <p>每一層的 50%，都以自己的父元素內容寬度為基準。</p>

  <div class="parent">
    父元素：頁面的 80%
    <div class="child">
      子元素：父元素的 50%
      <div class="grandchild">
        孫元素：子元素的 50%
      </div>
    </div>
  </div>
</body>
</html>
